<style>
  :root {
    --bg: #FBF7F0; --card: #FFFFFF; --ink: #1F2A24; --muted: #6B7069; --line: #ECE4D6;
    --safe: #1E7A4F; --safe-soft: #E4F2EA; --warn: #B86A00; --warn-soft: #FFF1DC;
    --danger: #C62828; --danger-deep: #8E1414; --danger-soft: #FDE8E8; --mic: #2F5D50;
    --shadow: 0 1px 2px rgba(31,42,36,.06), 0 8px 24px rgba(31,42,36,.08);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121714; --card: #1B221E; --ink: #EEF2EE; --muted: #A2ABA4; --line: #2A332E;
            --safe-soft: #17301F; --warn-soft: #33260F; --danger-soft: #3A1616; --danger: #E5484D; --mic: #3E7A69;
            --shadow: 0 8px 24px rgba(0,0,0,.35); }
  }
  * { box-sizing: border-box; margin: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body { font-family: "Mukta", "Noto Sans Tamil", "Noto Sans Bengali", system-ui, sans-serif; background: var(--bg);
         color: var(--ink); line-height: 1.45; min-height: 100vh; }
  main { max-width: 520px; margin: 0 auto; padding: 16px 16px 40px; }

  /* header */
  /* long Tamil/Bengali chip labels wrap the chips onto their own row instead of squeezing the brand */
  header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand .logo { width: 44px; height: 44px; flex: none; }
  .brand b { display: block; font-size: 26px; font-weight: 800; line-height: 1.1; }
  .brand span { font-size: 13px; color: var(--muted); white-space: nowrap; }
  .tools { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; margin-left: auto; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 999px;
          background: var(--card); border: 1px solid var(--line); font: inherit; font-size: 13px; font-weight: 500;
          color: var(--ink); white-space: nowrap; }
  .chip i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .chip.on i { background: var(--safe); box-shadow: 0 0 0 3px var(--safe-soft); }
  button.chip { cursor: pointer; }

  /* listen button */
  .hero { display: grid; place-items: center; padding: 26px 0 18px; }
  .ring-wrap { position: relative; width: 220px; height: 220px; display: grid; place-items: center; }
  .ring { position: absolute; inset: 0; border-radius: 50%; background: var(--mic); opacity: 0; transform: scale(1);
          transition: transform .12s ease-out, opacity .3s; }
  .listening .ring { opacity: .14; }
  .listening .ring.r2 { opacity: .08; }
  #listen { position: relative; width: 180px; height: 180px; border-radius: 50%; border: 0; cursor: pointer;
            background: var(--mic); color: #fff; font: inherit; display: grid; place-items: center; align-content: center;
            gap: 4px; box-shadow: 0 10px 30px rgba(47,93,80,.35); transition: transform .15s, background .3s; padding: 12px; }
  #listen:active { transform: scale(.97); }
  #listen svg { width: 46px; height: 46px; }
  #listen .big { font-size: 32px; font-weight: 800; line-height: 1.1; }
  .listening #listen { background: #24493F; }
  .hint { text-align: center; margin-top: 14px; font-size: 17px; }

  /* status */
  .status { display: flex; gap: 14px; align-items: flex-start; padding: 16px; border-radius: 18px; background: var(--card);
            box-shadow: var(--shadow); border: 2px solid transparent; transition: background .3s, border-color .3s; }
  .status .icon { width: 48px; height: 48px; border-radius: 14px; flex: none; display: grid; place-items: center;
                  background: var(--safe-soft); color: var(--safe); }
  .status .icon svg { width: 28px; height: 28px; }
  .status h2 { font-size: 22px; font-weight: 800; line-height: 1.25; }
  .status p { font-size: 17px; margin-top: 2px; }
  .meter { height: 8px; border-radius: 4px; background: var(--line); margin-top: 10px; overflow: hidden; }
  .meter div { height: 100%; width: 0; background: var(--safe); border-radius: 4px; transition: width .5s, background .3s; }
  .status.caution { background: var(--warn-soft); border-color: var(--warn); }
  .status.caution .icon { background: var(--warn); color: #fff; }
  .status.caution .meter div { background: var(--warn); }
  .status.danger { background: var(--danger-soft); border-color: var(--danger); }
  .status.danger .icon { background: var(--danger); color: #fff; }
  .status.danger h2 { color: var(--danger); }
  .status.danger .meter div { background: var(--danger); }

  /* cards */
  .card { background: var(--card); border-radius: 18px; padding: 16px; margin-top: 14px; box-shadow: var(--shadow); }
  .card h3 { font-size: 15px; font-weight: 700; color: var(--muted); margin-bottom: 8px; }
  #captions { font-size: 19px; min-height: 56px; max-height: 190px; overflow-y: auto; }
  #captions .old { color: var(--muted); }
  #captions .empty { color: var(--muted); font-size: 16px; }
  #flags { display: flex; flex-wrap: wrap; gap: 8px; }
  #flags span { padding: 6px 12px; border-radius: 999px; background: var(--warn-soft); color: var(--ink); font-size: 14px;
                border: 1px solid var(--line); }
  #flags .empty { background: none; border: 0; padding: 0; color: var(--muted); font-size: 16px; }

  /* demo drawer */
  details.card summary { cursor: pointer; font-weight: 700; font-size: 17px; list-style: none; display: flex;
                         justify-content: space-between; align-items: center; }
  details.card summary::-webkit-details-marker { display: none; }
  details.card summary::after { content: "+"; font-size: 24px; color: var(--muted); }
  details[open].card summary::after { content: "–"; }
  .demos { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
  .demos button { text-align: left; padding: 12px; border-radius: 14px; border: 1px solid var(--line); background: var(--bg);
                  color: var(--ink); font: inherit; font-size: 15px; font-weight: 600; cursor: pointer; line-height: 1.3; }
  .demos button:disabled { opacity: .5; cursor: wait; }

  /* helpline + footer */
  .helpline { display: flex; align-items: center; justify-content: center; gap: 6px; flex-wrap: wrap; margin-top: 14px;
              padding: 14px; border-radius: 18px; background: var(--card); border: 2px solid var(--line); color: var(--ink);
              text-decoration: none; font-size: 18px; font-weight: 700; text-align: center; }
  .helpline b { color: var(--danger); font-size: 22px; }
  footer { margin-top: 18px; font-size: 13px; color: var(--muted); text-align: center; }
  #err { margin-top: 10px; padding: 10px 14px; border-radius: 12px; background: var(--warn-soft); font-size: 14px; display: none; }

  /* danger takeover */
  #alarm { position: fixed; inset: 0; z-index: 10; background: var(--danger); color: #fff; display: none;
           flex-direction: column; justify-content: center; padding: 24px; padding-bottom: max(24px, env(safe-area-inset-bottom));
           animation: flash 1.2s ease-in-out infinite alternate; overflow-y: auto; }
  #alarm.show { display: flex; }
  @keyframes flash { to { background: var(--danger-deep); } }
  @media (prefers-reduced-motion: reduce) { #alarm { animation: none; } .ring { transition: none; } }
  #alarm .inner { max-width: 520px; margin: 0 auto; width: 100%; }
  #alarm svg { width: 64px; height: 64px; }
  #alarm h1 { font-size: 44px; font-weight: 800; line-height: 1.15; margin-top: 8px; }
  #alarm .type { font-size: 20px; font-weight: 700; opacity: .9; margin-top: 4px; }
  #alarm .say { font-size: 25px; font-weight: 700; line-height: 1.35; margin: 18px 0; }
  #alarm ul { padding-left: 20px; font-size: 15px; opacity: .9; }
  #alarm .actions { display: grid; gap: 10px; margin-top: 22px; }
  #alarm a, #alarm button { display: block; text-align: center; padding: 16px; border-radius: 16px; font: inherit;
                            font-size: 20px; font-weight: 800; text-decoration: none; cursor: pointer; }
  #alarm a { background: #fff; color: var(--danger-deep); }
  #alarm button { background: transparent; color: #fff; border: 2px solid rgba(255,255,255,.7); }
  #toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 20; background: var(--ink);
           color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 15px; display: none; max-width: 90vw; }

  /* language picker */
  #langPick { position: fixed; inset: 0; z-index: 30; background: var(--bg); display: none; overflow-y: auto; }
  #langPick.show { display: block; }
  #langPick .inner { max-width: 440px; margin: 0 auto; padding: 40px 16px; }
  #langPick .logo { width: 88px; height: 88px; display: block; }
  #langPick h1 { font-size: 24px; font-weight: 800; margin: 14px 0 4px; line-height: 1.3; }
  #langPick p { color: var(--muted); margin-bottom: 22px; }
  #langPick button { display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 18px 20px;
                     margin-top: 12px; border-radius: 18px; border: 2px solid var(--line); background: var(--card);
                     color: var(--ink); font: inherit; font-size: 24px; font-weight: 800; cursor: pointer; text-align: left; }
  #langPick button small { font-size: 14px; font-weight: 500; color: var(--muted); }
  #langPick button.current { border-color: var(--mic); }
</style>
</head>
<body>
<main>
  <header>
    <div class="brand">
      <img class="logo" src="/icons/mark-256.png?v=2" alt="" width="44" height="44">
      <div><b data-t="brand"></b><span>Kavach · scam-call shield</span></div>
    </div>
    <div class="tools">
      <button class="chip" id="langBtn" aria-label="Change language">🌐 <span id="langName"></span></button>
      <div class="chip" id="family"><i></i><span id="familyText"></span></div>
    </div>
  </header>

  <section class="hero" id="hero">
    <div class="ring-wrap">
      <div class="ring r2" id="ring2"></div>
      <div class="ring" id="ring1"></div>
      <button id="listen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
        <span class="big" id="btnBig"></span>
      </button>
    </div>
    <p class="hint" id="hint"></p>
  </section>

  <section class="status" id="status" aria-live="polite">
    <div class="icon" id="statusIcon"></div>
    <div style="flex:1">
      <h2 id="statusTitle"></h2>
      <p id="statusMsg"></p>
      <div class="meter"><div id="bar"></div></div>
    </div>
  </section>
  <div id="err"></div>

  <section class="card">
    <h3 data-t="captionsTitle"></h3>
    <div id="captions"></div>
  </section>

  <section class="card">
    <h3 data-t="flagsTitle"></h3>
    <div id="flags"></div>
  </section>

  <details class="card" id="demoBox">
    <summary><span data-t="demoTitle"></span></summary>
    <div class="demos" id="demos"></div>
  </details>

  <a class="helpline" href="tel:1930" id="helpline"></a>
  <footer><span data-t="footer"></span><br>Built on Gnani AI · Prisma · Evon · Timbre</footer>
</main>

<div id="alarm" role="alertdialog" aria-labelledby="alarmTitle">
  <div class="inner">
    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4M12 17h.01"/></svg>
    <h1 id="alarmTitle"></h1>
    <div class="type" id="alarmType"></div>
    <p class="say" id="alarmSay"></p>
    <ul id="alarmWhy"></ul>
    <div class="actions">
      <a href="tel:1930" data-t="alarmCall"></a>
      <button id="alarmOk" data-t="alarmOk"></button>
    </div>
  </div>
</div>

<div id="langPick" role="dialog" aria-labelledby="langPickTitle">
  <div class="inner">
    <img class="logo" src="/icons/mark-256.png?v=2" alt="" width="88" height="88">

    <p>Kavach will listen, speak and show everything in this language.</p>
    <div id="langList"></div>
  </div>
</div>
<div id="toast"></div>

        "A money laundering case has been registered against your Aadhaar.",

        "Your check-up is tomorrow at eleven.", "Please bring your old reports."] },

};
const ICONS = {
  danger: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4M12 17h.01"/></svg>',
  safe: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 4 5v6c0 5 3.4 9.3 8 11 4.6-1.7 8-6 8-11V5l-8-3Z"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg>',
  caution: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 7v6M12 17h.01"/></svg>',
};

let lang = null, ws, stream, chunkTimer, audioCtx, pcm = [], listening = false, guardianOn = false;
let spoken = { caution: false, danger: false };
const T = () => LANGS[lang].t;
const esc = s => String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

function savedLang() { try { return localStorage.getItem("kavach-lang"); } catch (e) { return null; } }

function setLang(code) {
  lang = code;
  try { localStorage.setItem("kavach-lang", code); } catch (e) {}  // remembered on this phone only
  const L = LANGS[lang];
  document.documentElement.lang = L.html;
  document.title = `${L.t.brand} · Kavach`;
  document.querySelectorAll("[data-t]").forEach(el => el.innerHTML = L.t[el.dataset.t]);
  $("langName").textContent = L.name;
  $("helpline").innerHTML = L.t.helpline;
  $("alarmTitle").innerHTML = L.t.alarmTitle;
  $("demos").innerHTML = L.demos.map((d, i) => `<button data-i="${i}">${d.icon} ${esc(d.name)}</button>`).join("");
  showFamily();
  if (listening) $("listen").click();  // a running session used the old language: stop it
  setListening(false);
  reset();
}

// ---------- language picker (first launch, and the 🌐 chip)
$("langList").innerHTML = Object.entries(LANGS).map(([code, L]) =>
  `<button data-code="${code}">${L.name} <small>${L.en}</small></button>`).join("");
$("langList").onclick = e => {
  const b = e.target.closest("button"); if (!b) return;
  setLang(b.dataset.code); $("langPick").classList.remove("show");
};
$("langBtn").onclick = () => {
  document.querySelectorAll("#langList button").forEach(b => b.classList.toggle("current", b.dataset.code === lang));
  $("langPick").classList.add("show");
};

// ---------- server connection: the chosen language tells Prisma what to listen for and Timbre what to speak
function connect() {
  return new Promise((res, rej) => {
    ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws/listen?lang=" + lang);
    ws.binaryType = "arraybuffer";
    ws.onopen = res; ws.onerror = rej; ws.onmessage = e => render(JSON.parse(e.data));
  });
}

// ---------- rendering
function setStatus(level, title, msg, risk) {
  $("status").className = "status " + level;
  $("statusIcon").innerHTML = ICONS[level] || ICONS.caution;
  $("statusTitle").textContent = title; $("statusMsg").textContent = msg;
  $("bar").style.width = (risk || 0) + "%";
}

function renderCaptions(text) {
  if (!text || !text.trim()) { $("captions").innerHTML = `<span class="empty">${T().captionsEmpty}</span>`; return; }
  const parts = text.split(/(?<=[।.?!])\s+/).filter(Boolean);
  $("captions").innerHTML = parts.map((p, i) => i < parts.length - 2 ? `<span class="old">${esc(p)}</span>` : esc(p)).join(" ");
  $("captions").scrollTop = 1e6;
}

let last = { transcript: "", risk: 0, level: "safe", reasons: [] };
function render(st) {
  last = st;
  showError(st.error);
  renderCaptions(st.transcript);
  const flags = st.reasons || [];
  $("flags").innerHTML = flags.length ? flags.map(r => `<span>${esc(r)}</span>`).join("")
                                      : `<span class="empty">${T().flagsEmpty}</span>`;
  if (st.level === "danger") {
    setStatus("danger", T().dangerTitle, st.warning_text, st.risk);
    showAlarm(st);
  } else if (st.level === "caution") {
    setStatus("caution", T().cautionTitle, st.warning_text, st.risk);
  } else {
    const heard = st.transcript && st.transcript.trim();
    setStatus("safe", listening || heard ? T().safeTitle : T().ready,
              listening ? T().safeListening : (heard ? T().safeDone : T().idle), st.risk);
  }
  if (st.level !== "safe" && !spoken[st.level] && !spoken.danger) { spoken[st.level] = true; speak(st.warning_audio, st.warning_text); }
  if (st.fire_alert && guardianOn) toast(T().familyAlerted);
}

function showAlarm(st) {
  const L = LANGS[lang];
  $("alarmType").textContent = L.labels[st.scam_type] || L.labels.none;
  $("alarmSay").textContent = st.warning_text;
  $("alarmWhy").innerHTML = (st.reasons || []).slice(0, 3).map(r => `<li>${esc(r)}</li>`).join("");
  if (!$("alarm").dataset.dismissed) $("alarm").classList.add("show");
}
$("alarmOk").onclick = () => { $("alarm").classList.remove("show"); $("alarm").dataset.dismissed = "1"; };

function showError(msg) { $("err").style.display = msg ? "block" : "none"; $("err").textContent = msg ? "⚠ " + msg : ""; }
function toast(msg) { $("toast").textContent = msg; $("toast").style.display = "block"; setTimeout(() => $("toast").style.display = "none", 4000); }

function reset() {
  spoken = { caution: false, danger: false };
  delete $("alarm").dataset.dismissed; $("alarm").classList.remove("show");
  render({ transcript: "", risk: 0, level: "safe", reasons: [] });
}

// ---------- voice: Timbre clip from the server, browser voice only as a fallback
async function speak(url, text) {
  if (url) {
    try {
      const r = await fetch(url);
      if (r.status === 200) { new Audio(URL.createObjectURL(await r.blob())).play(); return; }
    } catch (e) {}
  }
  const u = new SpeechSynthesisUtterance(text); u.lang = lang; u.rate = 0.9;
  speechSynthesis.cancel(); speechSynthesis.speak(u);
}

// ---------- mic: raw PCM -> 16 kHz mono WAV every 4 s (Prisma accepts WAV directly)
const TARGET_SR = 16000, CHUNK_S = 4;
function toWav(samples, sr) {
  const buf = new ArrayBuffer(44 + samples.length * 2), v = new DataView(buf);
  const str = (o, s) => [...s].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
  str(0, "RIFF"); v.setUint32(4, 36 + samples.length * 2, true); str(8, "WAVEfmt ");
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, sr, true); v.setUint32(28, sr * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  str(36, "data"); v.setUint32(40, samples.length * 2, true);
  samples.forEach((s, i) => v.setInt16(44 + i * 2, Math.max(-1, Math.min(1, s)) * 0x7fff, true));
  return buf;
}

function startCapture() {
  audioCtx = new AudioContext();
  const src = audioCtx.createMediaStreamSource(stream);
  const proc = audioCtx.createScriptProcessor(4096, 1, 1);
  const ratio = audioCtx.sampleRate / TARGET_SR;
  proc.onaudioprocess = e => {
    const x = e.inputBuffer.getChannelData(0);
    let sum = 0;
    for (let i = 0; i < x.length; i++) sum += x[i] * x[i];
    showLevel(Math.sqrt(sum / x.length));
    for (let i = 0; i < x.length / ratio; i++) pcm.push(x[Math.floor(i * ratio)]);
  };
  src.connect(proc); proc.connect(audioCtx.destination);
  chunkTimer = setInterval(() => {
    if (pcm.length && ws.readyState === 1) ws.send(toWav(pcm, TARGET_SR));
    pcm = [];
  }, CHUNK_S * 1000);
}

function showLevel(rms) {  // rings breathe with the voice so the parent can see it is hearing the call
  const l = Math.min(1, rms * 8);
  $("ring1").style.transform = `scale(${1 + l * 0.18})`;
  $("ring2").style.transform = `scale(${1 + l * 0.32})`;
}

// Keep the screen on while listening, so the spare phone doesn't sleep mid-call.
let wakeLock = null;
async function keepAwake(on) {
  try {
    if (on && "wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen");
    else if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; }
  } catch (e) {}  // denied or unsupported: the page still works
}
document.addEventListener("visibilitychange", () => {  // the lock is dropped when the page is hidden; take it back
  if (listening && document.visibilityState === "visible") keepAwake(true);
});

function setListening(on) {
  listening = on;
  keepAwake(on);
  $("hero").classList.toggle("listening", on);
  $("btnBig").textContent = on ? T().stop : T().listen;
  $("listen").setAttribute("aria-label", on ? T().stop : T().listen);
  $("hint").textContent = on ? T().hintListening : T().hintIdle;
  showLevel(0);
}

$("listen").onclick = async () => {
  if (listening) {
    clearInterval(chunkTimer); pcm = [];
    if (audioCtx) audioCtx.close();
    stream.getTracks().forEach(t => t.stop()); ws.close();
    setListening(false); render({ ...last, fire_alert: false });  // keep what was heard on screen
    return;
  }
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: true } });
    await connect();
  } catch (e) { showError(T().micError); return; }
  reset(); setListening(true); render({ transcript: "", risk: 0, level: "safe", reasons: [] }); startCapture();
};

// ---------- demo calls (typed lines through the same live pipeline, in the chosen language)
$("demos").onclick = async e => {
  const b = e.target.closest("button"); if (!b) return;
  if (listening) $("listen").click();
  try { await connect(); } catch (err) { showError(T().serverError); return; }
  reset();
  document.querySelectorAll(".demos button").forEach(x => x.disabled = true);
  window.scrollTo({ top: 0, behavior: "smooth" });
  for (const line of LANGS[lang].demos[b.dataset.i].lines) {
    ws.send(JSON.stringify({ text: line }));
    await new Promise(r => setTimeout(r, 2200));
  }
  document.querySelectorAll(".demos button").forEach(x => x.disabled = false);
};

// ---------- family-alert status
function showFamily() {
  $("family").classList.toggle("on", guardianOn);
  $("familyText").textContent = guardianOn ? T().familyOn : T().familyOff;
}
fetch("/health").then(r => r.json()).then(h => { guardianOn = h.guardian; if (lang) showFamily(); }).catch(() => {});

if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});

// first launch: ask for the language; afterwards use the remembered one
const remembered = savedLang();
if (remembered && LANGS[remembered]) setLang(remembered);
else { setLang("hi-IN"); $("langPick").classList.add("show"); }
</script>
