<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>कवच · Voices</title>
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root { --bg: #FBF7F0; --card: #fff; --ink: #1F2A24; --muted: #6B7069; --line: #ECE4D6; --accent: #2F5D50; }
  @media (prefers-color-scheme: dark) { :root { --bg: #121714; --card: #1B221E; --ink: #EEF2EE; --muted: #A2ABA4; --line: #2A332E; } }
  body { margin: 0; font-family: "Mukta", system-ui, sans-serif; background: var(--bg); color: var(--ink); }
  main { max-width: 560px; margin: 0 auto; padding: 24px 16px 40px; }
  h1 { font-size: 26px; margin: 0; } p { color: var(--muted); }
  .say { font-size: 18px; color: var(--ink); background: var(--card); padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--card);
         border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; margin-top: 10px; flex-wrap: wrap; }
  .row b { font-size: 18px; } .row small { display: block; color: var(--muted); }
  .row.before { opacity: .8; border-style: dashed; }
  audio { width: 260px; max-width: 100%; }
</style>
</head>
<body>
<main>
  <h1>Pick Kavach's voice</h1>
  <p>The same warning in each Timbre v3.0 voice. Set your favourite as <code>TIMBRE_VOICE</code> in <code>.env</code>.</p>
  <p class="say">सावधान! यह कॉल फ्रॉड लग रही है। पुलिस कभी फ़ोन पर पैसे नहीं माँगती। कॉल काट दीजिए।</p>
  <div id="list"></div>
</main>
<script>
  const voices = ["Shivani", "Lakshmi", "Kalpana", "Chetana", "Vasudha", "Riyaa", "Tarika"];
  const row = (file, name, note, cls = "") =>
    `<div class="row ${cls}"><div><b>${name}</b><small>${note}</small></div><audio controls preload="none" src="/voices/${file}.wav"></audio></div>`;
  document.getElementById("list").innerHTML = voices.map(v => row(v, v, "Devanagari text, with pauses")).join("") +
    row("before-romanized-Shivani", "Before", "old romanized text (Shivani)", "before") +
    row("warning-ta-IN", "தமிழ் · Tamil", "Shivani, played when the caller speaks Tamil") +
    row("warning-bn-IN", "বাংলা · Bengali", "Shivani, played when the caller speaks Bengali");
</script>
</body>
</html>
